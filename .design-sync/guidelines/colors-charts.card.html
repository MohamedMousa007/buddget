<!-- @dsCard group="Colors" viewport="700x200" name="Chart & category ramp" subtitle="cat-1…6 in fixed order — charts and category chips share these" -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />

<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--color-brand-bg); color: var(--color-brand-text-primary); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; min-width: 0; }
  .chip { height: 64px; border-radius: var(--radius-xl); border: 1px solid var(--color-brand-border); }
  .name { font-size: 12px; font-weight: 600; margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--color-brand-text-muted); margin-top: 2px; }
  .note { font-size: 11.5px; color: var(--color-brand-text-secondary); margin-top: 14px; line-height: 1.5; }
  .note b { color: var(--color-brand-text-primary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--color-cat-1)"></div><div class="name">cat-1</div><div class="hex">#1FC3B2</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-cat-2)"></div><div class="name">cat-2</div><div class="hex">#EDC463</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-cat-3)"></div><div class="name">cat-3</div><div class="hex">#F27E66</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-cat-4)"></div><div class="name">cat-4</div><div class="hex">#8A94F5</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-cat-5)"></div><div class="name">cat-5</div><div class="hex">#57B2ED</div></div>
    <div class="sw"><div class="chip" style="background:var(--color-cat-6)"></div><div class="name">cat-6</div><div class="hex">#A17DF9</div></div>
  </div>
  <p class="note"><code>--chart-1…5</code> mirror these, so a chart series and its category chip always agree. Light-mode values keep the source ramp wherever it already clears 3:1 as an icon glyph; only cat-1, cat-2 and cat-5 needed darkening.</p>

</body>
</html>
