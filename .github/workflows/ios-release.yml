name: iOS release (TestFlight)

# Manual only. macOS minutes cost 10x on private repos, so a guard skips the run
# if one succeeded in the last hour (Apple also caps uploads). Use force to override.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the 1-hour guard
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ios-release.yml --status success -L 1 --json createdAt -q '.[0].createdAt // empty')
          skip=false
          if [ -n "$last" ] && [ "${{ inputs.force }}" != "true" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            [ "$age" -lt 3600 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "skip=$skip (last success: ${last:-none})"

  build:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Require Xcode 26 (App Store Connect needs the iOS 26 SDK)
        run: |
          major() { xcodebuild -version | awk 'NR==1{split($2,v,"."); print v[1]}'; }
          if [ "$(major)" -lt 26 ]; then
            x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$x" ] || { echo "No Xcode 26 on this runner:"; ls -d /Applications/Xcode*; exit 1; }
            sudo xcode-select -s "$x/Contents/Developer"
          fi
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Native env + Firebase plist
        env:
          NATIVE_ENV_LOCAL_B64: ${{ secrets.NATIVE_ENV_LOCAL_B64 }}
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          echo "$NATIVE_ENV_LOCAL_B64" | base64 --decode > .env.local
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Bump build number
        id: bump
        run: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          cur=$(grep -m1 -oE "CURRENT_PROJECT_VERSION = [0-9]+;" "$PBX" | grep -oE "[0-9]+")
          new=$((cur + 1))
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${new};/g" "$PBX"
          echo "build=$new" >> "$GITHUB_OUTPUT"

      - name: Build web bundle into iOS shell
        run: npm run cap:build

      - name: App Store Connect key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      # One pinned Apple Development certificate (scripts/ios-signing.mjs create-dev-cert). Without it every run starts with an
      # empty keychain and automatic signing creates a new certificate each time, until Apple's cap is hit.
      - name: Import pinned signing certificate
        env:
          IOS_DEV_P12_B64: ${{ secrets.IOS_DEV_P12_B64 }}
          IOS_DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          if [ -z "$IOS_DEV_P12_B64" ]; then echo "No pinned certificate: automatic signing will create one."; exit 0; fi
          KC="$RUNNER_TEMP/ci.keychain-db"; PW=$(uuidgen)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$IOS_DEV_P12_B64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$IOS_DEV_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=9PK34RL9DN archive

      - name: Export and upload to TestFlight
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Commit build number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App.xcodeproj/project.pbxproj
          git commit -m "chore(release): iOS ${{ steps.bump.outputs.build }} (CI)"
          for i in 1 2 3; do git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done

      - name: Summary
        run: echo "iOS build ${{ steps.bump.outputs.build }} uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
