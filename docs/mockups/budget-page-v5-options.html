<title>Budget Page Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a tab per question (critique, heroes, four page layouts, comparison). Phones use the app's tokens from globals.css. */
:root{
  --bg:#F4F7F6;--card:#FFFFFF;--elev:#ECF1F0;--sunk:#E2E9E8;--line:#DDE6E4;--line2:#CBD6D3;
  --ink:#0D1A18;--ink2:#566B68;--ink3:#646F6D;
  --pri:#0D8578;--pri-ink:#0B7568;--pri-soft:#E3F6F3;--pri-bright:#12B0A0;
  --red:#C2353B;--green:#107E38;--amber:#93630B;--amber-soft:#FBF0DA;--green-soft:#E3F5EA;--red-soft:#FBE7E7;
  --c1:#11A596;--c2:#B68E30;--c3:#E5684D;--c4:#6E7BF2;--c5:#389BD9;--c6:#8B5CF6;--c0:#646F6D;
  --on:#FFFFFF;--shadow:0 1px 2px rgba(13,26,24,.06),0 8px 24px rgba(13,26,24,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1413;--card:#121D1B;--elev:#1A2826;--sunk:#212C2A;--line:#233432;--line2:#2F4441;
  --ink:#EAF2F0;--ink2:#9DB2AF;--ink3:#8AA09D;
  --pri:#12A394;--pri-ink:#4FD6C8;--pri-soft:#12302D;--pri-bright:#1FC3B2;
  --red:#F0777C;--green:#4BC77A;--amber:#E7B552;--amber-soft:#33290F;--green-soft:#10301D;--red-soft:#3A1A1C;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#8AA09D;
  --on:#06201C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1413;--card:#121D1B;--elev:#1A2826;--sunk:#212C2A;--line:#233432;--line2:#2F4441;
  --ink:#EAF2F0;--ink2:#9DB2AF;--ink3:#8AA09D;
  --pri:#12A394;--pri-ink:#4FD6C8;--pri-soft:#12302D;--pri-bright:#1FC3B2;
  --red:#F0777C;--green:#4BC77A;--amber:#E7B552;--amber-soft:#33290F;--green-soft:#10301D;--red-soft:#3A1A1C;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#8AA09D;
  --on:#06201C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:start}
button:focus-visible{outline:2px solid var(--pri-bright);outline-offset:2px}
a{color:var(--pri-ink)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px}
.lede{margin:6px 0 0;color:var(--ink2);font-size:14px;max-width:66ch;line-height:1.5}
.bar-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:1;min-width:0}
.tab{height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:var(--on)}
.mode{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--elev);border-radius:12px;padding:3px;gap:3px}
.mode button{height:38px;padding:0 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);text-align:center}
.mode button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.grid{display:grid;gap:28px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.lab{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.lab span{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--elev);color:var(--ink2)}
.lab.rec span{background:var(--pri-soft);color:var(--pri-ink)}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
@media(max-width:900px){.notes{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13px;color:var(--ink2);line-height:1.5;min-width:0}
.note ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.note b{color:var(--ink)}
.sev{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-right:4px;background:var(--elev);color:var(--ink2)}
.sev.r{background:var(--red-soft);color:var(--red)}.sev.a{background:var(--amber-soft);color:var(--amber)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-top:1px solid var(--line);text-align:start;vertical-align:top}th{font-size:12px;color:var(--ink2);border-top:0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
.dotsc{letter-spacing:2px;color:var(--pri-ink);font-weight:700;white-space:nowrap}

.phone{width:100%;max-width:372px;margin:0 auto;border-radius:36px;border:1px solid var(--line2);background:var(--bg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;font-weight:600;color:var(--ink2);flex:none}
.scr{flex:1;padding:6px 16px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sub{font-size:12.5px;color:var(--ink2);margin:0}
.lbl{font-size:12px;color:var(--ink2);font-weight:500}
.cap{font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(13,26,24,.05)}
.num{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,monospace}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.ico.s{width:14px;height:14px}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink2)}
.chip{height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.flow{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--elev)}.flow i{display:block;height:100%;border-radius:3px}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;background:var(--elev);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.g{background:var(--green-soft);color:var(--green)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.t{background:var(--pri-soft);color:var(--pri-ink)}
.pbar{position:relative;height:10px;border-radius:5px;background:var(--elev)}.pbar>i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--pri-bright)}.pbar>i.a{background:var(--amber)}.pbar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.75}
.mini{position:relative;height:4px;border-radius:3px;background:var(--elev)}.mini>i{position:absolute;inset:0 auto 0 0;border-radius:3px}.mini>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7;border-radius:2px}
.lrow{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-top:1px solid var(--line);min-height:64px;width:100%}.lrow:first-child{border-top:0}
.lrow .tp{display:flex;align-items:center;gap:10px;min-width:0}
.lrow .tx{flex:1;min-width:0}.lrow .tx b{display:block;font-size:14.5px}.lrow .tx span{font-size:12px;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .tx span.a{color:var(--amber);font-weight:600}
.lrow .rt{text-align:end;flex:none}.lrow .rt b{display:block;font-size:13.5px}.lrow .rt span{font-size:11.5px;color:var(--ink3)}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:52px;width:100%}.ln:first-child{border-top:0}
.ln .t{flex:1;min-width:0}.ln .t b{display:block;font-size:14px;font-weight:600}.ln .t span{font-size:12px;color:var(--ink3)}.ln .t span.w{color:var(--amber)}
.ln .amt{font-size:14px;font-weight:600;text-align:end}.ln .amt small{display:block;font-size:11px;color:var(--ink3);font-weight:500}
.src{font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--elev);color:var(--ink2)}.src.e{background:var(--amber-soft);color:var(--amber)}
.tilec{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:120px;box-shadow:0 1px 2px rgba(13,26,24,.05)}
.lp{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:24px;border-radius:99px;padding:0 8px;font-size:11.5px;font-weight:700}
.lp.ok{background:var(--green-soft);color:var(--green)}.lp.lo{background:var(--amber-soft);color:var(--amber)}.lp.ov{background:var(--red-soft);color:var(--red)}.lp.z{background:var(--elev);color:var(--ink3)}
.tr{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 66px;gap:6px;align-items:center;min-height:48px;padding:4px 0;border-top:1px solid var(--line);font-size:12.5px;width:100%}.tr.h{min-height:30px;border-top:0;color:var(--ink2);font-size:11.5px;font-weight:600}.tr>*:not(:first-child){text-align:end;justify-self:end}
.pin{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font-size:10.5px;font-weight:700}
.ev{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);min-height:52px}.ev:first-child{border-top:0}
.date{width:40px;height:44px;border-radius:10px;background:var(--elev);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:10.5px;color:var(--ink2);font-weight:700}.date b{font-size:15px;color:var(--ink);line-height:1}
</style>

<div class="wrap">
  <header>
    <h1>Budget page options</h1>
    <p class="lede">The v4 summary card and segment rail, criticised, then a stronger hero and four page layouts. Switch Plan and This month at the top right. Sample data in EGP, day 14 of 30. Layouts A to D reuse the existing line row, plan sheet and review.</p>
  </header>
  <div class="bar-top"><div class="tabs" role="tablist" aria-label="Screens" id="tabs"></div><div class="mode" role="tablist" aria-label="View" id="mode"></div></div>
  <div id="stage" aria-live="polite"></div>
</div>

<script>
const I={
 home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 bank:'<path d="M10 18v-7"/><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/>',
 basket:'<path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 sprout:'<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
 check:'<path d="M20 6 9 17l-5-5"/>', back:'<path d="m15 18-6-6 6-6"/>', next:'<path d="m9 18 6-6-6-6"/>', down:'<path d="m6 9 6 6 6-6"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>', warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const buddgy=(s=32)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><rect x="5" y="8" width="38" height="32" rx="14" fill="var(--pri)"/><rect x="10" y="14" width="28" height="19" rx="9" fill="var(--on)" opacity=".95"/><ellipse cx="19" cy="23" rx="2.4" ry="3.2" fill="var(--pri)"/><ellipse cx="29" cy="23" rx="2.4" ry="3.2" fill="var(--pri)"/><path d="M20 29q4 3 8 0" stroke="var(--pri)" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const status='<div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>';
const fmt=n=>n.toLocaleString('en-US');
const INCOME=18500,DAY=14,DAYS=30,LEFTD=DAYS-DAY,TIME=DAY/DAYS;
const SEG=[
 {n:'Home & bills',i:'home',c:'var(--c1)',amt:6950,spent:5900},
 {n:'Subscriptions',i:'repeat',c:'var(--c4)',amt:410,spent:410},
 {n:'Debts',i:'bank',c:'var(--c3)',amt:2100,spent:1050},
 {n:'Everyday',i:'basket',c:'var(--c5)',amt:5200,spent:2980},
 {n:'Safety net',i:'shield',c:'var(--c2)',amt:1850,spent:0},
 {n:'Goals',i:'target',c:'var(--c6)',amt:1200,spent:600},
 {n:'Grow & give',i:'sprout',c:'var(--c0)',amt:790,spent:0},
];
/* every row always carries a status line and a number: the point of the redesign */
const FACT={
 plan:[['4 bills · rent is 30% of income',''],['3 subscriptions · linked live',''],['2 debts · Visa cleared Sep 2027',''],['5 lines · 2 are estimates','a'],['0.8 of 3 months held','a'],['Umrah trip · Mar 2027',''],['Zakat and a 290 buffer','']],
 month:[['2 of 4 paid · Internet due 20th',''],['All 3 charged',''],['1 of 2 paid · Visa due 25th',''],['Dining 170 over · 553 ahead of pace','a'],['Moves on the 25th',''],['On track · Mar 2027',''],['Zakat on the 25th','']],
};
const everyday=SEG[3],flexLeft=everyday.amt-everyday.spent,pace=Math.round(everyday.amt*TIME),ahead=everyday.spent-pace;
const stillToPay=[0,1,2].reduce((a,i)=>a+SEG[i].amt-SEG[i].spent,0);
const tile=(s,z=40)=>`<span class="tile" style="width:${z}px;height:${z}px;color:${s.c};background:color-mix(in srgb,${s.c} 16%,var(--card))">${ic(s.i)}</span>`;
const pct=a=>Math.round(a/INCOME*100)+'%';
const stats=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div><div class="lbl">Saving</div><b class="num" style="font-size:14px">18%</b></div><div><div class="lbl">Debt-free</div><b class="num" style="font-size:14px">Sep 2027</b></div><div><div class="lbl">Safety net</div><b class="num" style="font-size:14px">0.8 / 3 mo</b></div></div>`;
const phone=inner=>`<div class="phone">${status}<div class="scr">${inner}</div></div>`;
const planChip=`<button class="card row" style="height:56px;padding:0 12px;gap:12px;width:100%" aria-label="Plans: Balanced plan"><i style="width:10px;height:10px;border-radius:50%;background:var(--pri-bright)"></i><span style="flex:1;min-width:0"><b style="font-size:15px;display:block">Balanced plan</b><span class="sub" style="font-size:12px">Active since Oct</span></span>${ic('down','s')}</button>`;
const view=m=>`<div style="display:grid;grid-template-columns:1fr 1fr;background:var(--elev);border-radius:12px;padding:3px;gap:3px">${['plan','month'].map(k=>`<span style="height:40px;border-radius:9px;font-weight:700;font-size:13.5px;display:grid;place-items:center;${(m?'month':'plan')===k?'background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)':'color:var(--ink2)'}">${k==='plan'?'Plan':'This month'}</span>`).join('')}</div>`;
const flowBar=()=>`<div class="flow">${SEG.map(x=>`<i style="width:${x.amt/INCOME*100}%;background:${x.c}"></i>`).join('')}</div>`;

/* ---------- heroes ---------- */
function arc(r,start,len,color,w=12){const c=2*Math.PI*r;return `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-dasharray="${Math.max(0,c*len-2)} ${c}" stroke-dashoffset="${-c*start}" transform="rotate(-90 70 70)"/>`}
function heroDial(m){
 let svg,center;
 if(m){const f=everyday.spent/everyday.amt,r=54,a=-Math.PI/2+2*Math.PI*TIME;
  svg=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--elev)" stroke-width="12"/>${arc(r,0,f,'var(--amber)')}<line x1="${70+44*Math.cos(a)}" y1="${70+44*Math.sin(a)}" x2="${70+64*Math.cos(a)}" y2="${70+64*Math.sin(a)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
  center=`<div class="lbl">Left to spend</div><b class="num" style="font-size:24px;letter-spacing:-.02em">${fmt(flexLeft)}</b>`}
 else{let s=0;svg=SEG.map(x=>{const l=x.amt/INCOME,o=arc(54,s,l,x.c);s+=l;return o}).join('');
  center=`<div class="lbl">Income</div><b class="num" style="font-size:22px;letter-spacing:-.02em">${fmt(INCOME)}</b>`}
 return `<div class="card" style="display:flex;flex-direction:column;align-items:center;gap:12px"><div style="position:relative;width:140px;height:140px"><svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="${m?'Everyday spending against the pace of the month':'How income is split across seven segments'}">${svg}</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">${center}</div></div>
 ${m?`<span class="pill a">${ic('warn','s')}${fmt(ahead)} ahead of pace</span><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;text-align:center"><div><div class="lbl">Per day</div><b class="num" style="font-size:14px">${fmt(Math.round(flexLeft/LEFTD))}</b></div><div><div class="lbl">Days left</div><b class="num" style="font-size:14px">${LEFTD}</b></div><div><div class="lbl">Still to pay</div><b class="num" style="font-size:14px">${fmt(stillToPay)}</b></div></div>`
 :`<span class="pill g">${ic('check','s')}0 unassigned</span><div style="width:100%">${stats}</div>`}</div>`}
function heroBar(m){
 return `<div class="card" style="display:flex;flex-direction:column;gap:10px">${m
 ?`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="lbl">Left to spend</div><b class="num" style="font-size:30px;letter-spacing:-.02em;line-height:1.1">${fmt(flexLeft)}</b></div><div style="text-align:end"><b class="num" style="font-size:14px">${fmt(Math.round(flexLeft/LEFTD))} a day</b><div class="lbl">${LEFTD} days left</div></div></div>

 <span class="mini" aria-hidden="true"><i style="width:${w}%;background:${warn?'var(--amber)':s.c}"></i>${warn?`<u style="left:${TIME*100}%"></u>`:''}</span></button>`}

const lineSeg=m=>EDLINES.map(l=>{const sp=l[4],over=m&&sp>l[1];return `<button class="ln"><span class="t"><b>${l[0]}</b><span class="${over?'w':''}">${over?ic('warn','s')+' '+fmt(sp-l[1])+' over':l[2]}</span></span>${m?'':`<span class="src ${l[3]==='e'?'e':''}">${l[3]==='e'?'Estimated':'Your data'}</span>`}<span class="amt num">${m?fmt(sp)+`<small>of ${fmt(l[1])}</small>`:fmt(l[1])}</span></button>`}).join('');
const detail=m=>phone(`<div class="row"><button class="ib" aria-label="Back to budget">${ic('back')}</button><b style="flex:1;font-size:17px;text-align:center">Everyday</b><span class="pill">4 of 7</span></div>
 <div class="row" style="justify-content:space-between"><button class="ib" aria-label="Previous segment: Debts">${ic('back')}</button><div style="display:flex;gap:6px">${SEG.map((x,i)=>`<i style="width:${i===3?22:8}px;height:8px;border-radius:5px;background:${i===3?x.c:'var(--sunk)'}"></i>`).join('')}</div><button class="ib" aria-label="Next segment: Safety net">${ic('next')}</button></div>
 <div class="card" style="padding:12px 14px 4px"><div class="row" style="gap:12px;padding-bottom:6px">${tile(everyday)}<div style="flex:1;min-width:0"><b style="font-size:16px;display:block">Everyday</b><span class="sub num" style="font-size:12px">${m?'2,980 of 5,200 · 57% used':'5,200 planned · 28% of income'}</span></div>${m?'':'<span class="pill a">2 estimated</span>'}</div>
 <div class="row" style="gap:8px;padding:4px 0 8px;align-items:flex-start">${buddgy(22)}<span class="sub" style="font-size:12.5px;line-height:1.4">Caps sit at your 3-month average, trimmed 10% on dining.</span></div>${lineSeg(m)}</div>`);
const lab=(k,t,rec)=>`<div class="lab ${rec?'rec':''}"><span>${k}</span>${t}</div>`;
const notesHtml=n=>`<div class="notes">${n.map(x=>`<div class="note"><h2>${x[0]}</h2><ul>${x[1].map(y=>`<li>${y}</li>`).join('')}</ul></div>`).join('')}</div>`;

 notes:[['What it fixes',['The page answers “what should I do now?” instead of “what is the plan?”. Overdue and over-budget items come first with the action on the row, in the spirit of Copilot’s review queue.','Upcoming bills as a dated list is how Monarch and Copilot make recurring costs feel manageable.']],
  ['Criticism',['Turns the budget into an inbox: in a quiet month “Needs you” is empty and the page is half hollow.','The plan is no longer the object. Users who want to read or edit it go one level deeper, which the review and builder do not mirror.','Needs a reliable rule for what counts as “needs you” (a new engine concern) or it shows noise.']],
  ['Reuse',['PromptBanner and the nudge become the list; event rows are a LineRow variant; the segment strip is the FlowStrip.','Best as a section inside A (the “Needs you” card replaces the nudge row), not a separate layout.']]]};}
function compare(){
 const rows=[['Every segment shows status and a number','●○○○','●●●●','●●●○','●●●●','●●○○'],['Fits about one screen','●●●○','●●●○','●○○○','●●●○','●●○○'],['Fast to find the worst segment','●○○○','●●●●','●●○○','●●●●','●●●●'],['Same pattern as the plan review','●●●●','●●●●','●●●○','●○○○','●○○○'],['Reuses existing components','●●●○','●●●●','●●●○','●●○○','●●○○'],['First-time user clarity','●●○○','●●●○','●●●●','●●○○','●●●○'],['Works in Arabic (RTL, longer names)','●●○○','●●●○','●●○○','●○○○','●●●○'],['Build effort (more dots = less)','●●●○','●●●○','●●○○','●●○○','●●○○']];
 return {full:`<div class="col"><div class="tw"><table><thead><tr><th>Criterion (my judgement)</th><th>v4 rail</th><th>A Ledger</th><th>B Tiles</th><th>C Table</th><th>D Action-first</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td class="dotsc">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
 <div class="note"><h2>Recommendation</h2><ul><li><b>Replace the rail with A (Ledger) and use H2 (pace bar) as its hero.</b> It fixes the filter feeling directly: all seven segments always carry a status and a number, in about one screen, and the plan review becomes the same list with state dots.</li><li><b>Borrow from D:</b> a “Needs you” card replaces the single nudge row, capped at three items and hidden when empty.</li><li><b>Leave B and C out:</b> B scrolls on every phone; C is the accordion in disguise and the hardest in Arabic. C could return as a Table toggle later.</li><li><b>Effect on the plan:</b> step 3 becomes “summary hero + ledger + segment page” instead of “rail + segment card”. The segment page, review and builder stay as planned. <code>BlockStepper</code> still becomes <code>SegmentRail</code> (your approved decision) but is used for the prev/next dots on the segment page and in the review, not as the page’s main control.</li></ul></div>
 <div class="note"><h2>How far to trust these ratings</h2><ul><li>They are my judgement from the mockups, not user tests. The quickest check is to put A and D on a device and ask someone to find “what is due soon” in 5 seconds.</li><li>The phone is drawn tall; a small Android phone (640px) pushes the last one or two rows of A below the fold.</li></ul></div></div>`};
}
const SCREENS=[['Critique',critique],['Heroes',heroes],['A · Ledger',layoutA],['B · Tiles',layoutB],['C · Table',layoutC],['D · Action-first',layoutD],['Compare',compare]];
function draw(){
 document.getElementById('tabs').innerHTML=SCREENS.map((s,i)=>`<button class="tab" role="tab" aria-selected="${i===tab}" data-tab="${i}">${s[0]}</button>`).join('');
 document.getElementById('mode').innerHTML=['plan','month'].map(k=>`<button role="tab" aria-selected="${mode===k}" data-mode="${k}">${k==='plan'?'Plan':'This month'}</button>`).join('');
 const o=SCREENS[tab][1](),st=document.getElementById('stage');
 if(o.full)st.innerHTML=o.full;
 else if(o.cols)st.innerHTML=`<div class="grid g3">${o.cols.join('')}</div>${notesHtml(o.notes)}`;
 else st.innerHTML=`<div class="grid g2"><div class="col">${o.a}</div><div class="col">${o.b||''}</div></div>${o.notes?notesHtml(o.notes):''}`;
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab]'),m=e.target.closest('[data-mode]');if(t){tab=+t.dataset.tab;draw()}else if(m){mode=m.dataset.mode;draw()}});
draw();
