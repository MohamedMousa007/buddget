<title>Budget Flow v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone at a time, flow tabs on top, "what changed" notes beside it. Tokens copied from the app's globals.css. */
:root{
  --bg:#F4F7F6;--card:#FFFFFF;--elev:#ECF1F0;--line:#DDE6E4;--line2:#CBD6D3;
  --ink:#0D1A18;--ink2:#566B68;--ink3:#646F6D;
  --pri:#0D8578;--pri-ink:#0B7568;--pri-soft:#E3F6F3;--pri-bright:#12B0A0;
  --red:#C2353B;--green:#107E38;--amber:#93630B;--amber-soft:#FBF0DA;--green-soft:#E3F5EA;
  --c1:#11A596;--c2:#B68E30;--c3:#E5684D;--c4:#6E7BF2;--c5:#389BD9;--c6:#8B5CF6;--c0:#646F6D;
  --on:#FFFFFF;--shadow:0 1px 2px rgba(13,26,24,.06),0 8px 24px rgba(13,26,24,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1413;--card:#121D1B;--elev:#1A2826;--line:#233432;--line2:#2F4441;
  --ink:#EAF2F0;--ink2:#9DB2AF;--ink3:#8AA09D;
  --pri:#12A394;--pri-ink:#4FD6C8;--pri-soft:#12302D;--pri-bright:#1FC3B2;
  --red:#F0777C;--green:#4BC77A;--amber:#E7B552;--amber-soft:#33290F;--green-soft:#10301D;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#8AA09D;
  --on:#06201C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1413;--card:#121D1B;--elev:#1A2826;--line:#233432;--line2:#2F4441;
  --ink:#EAF2F0;--ink2:#9DB2AF;--ink3:#8AA09D;
  --pri:#12A394;--pri-ink:#4FD6C8;--pri-soft:#12302D;--pri-bright:#1FC3B2;
  --red:#F0777C;--green:#4BC77A;--amber:#E7B552;--amber-soft:#33290F;--green-soft:#10301D;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#8AA09D;
  --on:#06201C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--pri-bright);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:24px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.lede{margin:4px 0 0;color:var(--ink2);font-size:14px;max-width:62ch}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tab{height:44px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--pri);border-color:var(--pri);color:var(--on)}
.stage{display:grid;grid-template-columns:minmax(0,392px) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.notes{display:flex;flex-direction:column;gap:14px;min-width:0}
.notes h2{margin:0;font-size:16px}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:13.5px;color:var(--ink2);line-height:1.5}
.note b{color:var(--ink)}
.note .tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:6px}
.tag.rm{background:#FBE7E7;color:#A82A31}.tag.new{background:var(--pri-soft);color:var(--pri-ink)}.tag.keep{background:var(--elev);color:var(--ink2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.rm{background:#3A1A1C;color:#F0777C}}

/* phone */
.phone{width:100%;max-width:392px;margin:0 auto;border-radius:36px;border:1px solid var(--line2);background:var(--bg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:760px}
.status{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;font-weight:600;color:var(--ink2)}
.scr{flex:1;padding:6px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.micro{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink3)}
.h2{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--ink2);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.num{font-variant-numeric:tabular-nums}
.btn{height:52px;border-radius:14px;background:var(--pri);color:var(--on);font-weight:700;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line2);font-weight:600}
.btn.s{height:44px;font-size:13.5px}
.btn.g{background:none;color:var(--ink2);font-weight:600;height:44px;font-size:13.5px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.chip{height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pri-soft);border-color:var(--pri);color:var(--pri-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.sel{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);min-height:56px;text-align:start;width:100%}
.sel[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-soft)}
.bar{height:6px;border-radius:99px;background:var(--elev);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri-bright)}
.flow{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.flow i{display:block;height:100%}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:3px 8px;background:var(--elev);color:var(--ink2);white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.t{background:var(--pri-soft);color:var(--pri-ink)}
.bud{display:inline-grid;place-items:center;flex:none}
textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:10px 12px;resize:none}
.sep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:12px}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}

/* segment rail */
.rail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.seg{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;padding:6px 0 4px;border-radius:14px;border:1.5px solid transparent;position:relative}
.seg[aria-selected="true"]{background:var(--card);border-color:var(--line2)}
.seg .ring{position:relative;width:38px;height:38px;display:grid;place-items:center}
.seg .ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.seg .cap{font-size:10.5px;font-weight:700;color:var(--ink2)}
.seg .tile{width:32px;height:32px;border-radius:10px}
.btn[disabled]{opacity:.4}
.dot{position:absolute;top:2px;right:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg);background:var(--amber)}
.dot.ok{background:var(--green)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-height:52px}
.line:first-child{border-top:0}
.line .t{flex:1;min-width:0}.line .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line .t span{font-size:12px;color:var(--ink3)}
.seeAll{font-size:12.5px;color:var(--pri-ink);font-weight:700}
</style>

<div class="wrap">
  <header>
    <h1>Budget flow v3</h1>
    <p class="lede">One start screen, adaptive questions with no dead-end buttons, a plan reviewed one segment at a time, and a Budget page that shows the whole month without scrolling. Tap through each screen. Amounts are sample data in EGP.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Flow screens" id="tabs"></div>
  <div class="stage">
    <div id="phone"></div>
    <aside class="notes" id="notes" aria-live="polite"></aside>
  </div>
</div>

<script>
const I={
 home:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 bank:'<path d="M10 18v-7"/><path d="M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/>',
 basket:'<path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>',
 shield:'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
 target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
 sprout:'<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 next:'<path d="m9 18 6-6-6-6"/>',
 spark:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>',
 layout:'<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
 copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 coin:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
 hammer:'<path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>',
 hist:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
 list:'<path d="M3 5h.01M3 12h.01M3 19h.01M8 5h13M8 12h13M8 19h13"/>',
 warn:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const buddgy=(s=44,mood='happy')=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="8" width="38" height="32" rx="14" fill="var(--pri)"/><rect x="10" y="14" width="28" height="19" rx="9" fill="var(--on)" opacity=".95"/>${mood==='think'?'<circle cx="19" cy="23" r="2.6" fill="var(--pri)"/><circle cx="29" cy="23" r="2.6" fill="var(--pri)"/>':'<ellipse cx="19" cy="23" rx="2.4" ry="3.2" fill="var(--pri)"/><ellipse cx="29" cy="23" rx="2.4" ry="3.2" fill="var(--pri)"/><path d="M20 29q4 3 8 0" stroke="var(--pri)" stroke-width="2" fill="none" stroke-linecap="round"/>'}</svg>`;
const status=`<div class="status"><span>9:41</span><span>5G ▮▮▮</span></div>`;
const fmt=n=>n.toLocaleString('en-US');

/* sample plan: income 18,500 EGP */
const INCOME=18500;
const SEG=[
 {k:'bills',n:'Home & bills',i:'home',c:'var(--c1)',amt:6950,spent:5900,lines:[['Rent',5500,'Due 1st · paid'],['Electricity & water',620,'Due 12th · paid'],['Internet',380,'Due 20th'],['School transport',450,'Due 25th']],why:'Rent is 30% of income, under the 33% guide.',est:0,left:'2 bills left'},
 {k:'subs',n:'Subscriptions',i:'repeat',c:'var(--c4)',amt:410,spent:410,lines:[['Netflix',180,'Charged 3rd'],['Spotify',90,'Charged 8th'],['iCloud',140,'Charged 11th']],why:'Linked live. Updates when a subscription changes.',est:0,left:'all charged'},
 {k:'debts',n:'Debts',i:'bank',c:'var(--c3)',amt:2100,spent:1050,lines:[['Car loan',1400,'Minimum · 9.5% APR'],['Visa card',700,'Minimum + extra 300']],why:'Extra goes to the Visa card first: highest rate, done by Sep 2027.',est:1,left:'1 of 2 paid'},
 {k:'everyday',n:'Everyday',i:'basket',c:'var(--c5)',amt:5200,spent:2980,lines:[['Groceries',2400,'3-month avg 2,350'],['Dining out',900,'Avg 1,100'],['Transport',1100,'Avg 1,050'],['Health & personal',500,'Estimated'],['Fun',300,'Estimated']],why:'Caps sit at your 3-month average, trimmed 10% on dining.',est:2,left:'on pace'},
 {k:'safety',n:'Safety net',i:'shield',c:'var(--c2)',amt:1850,spent:0,lines:[['Emergency fund',1850,'0.8 of 3 months held']],why:'First priority until you hold one month of essentials.',est:0,left:'due 25th'},
 {k:'goals',n:'Goals',i:'target',c:'var(--c6)',amt:1200,spent:600,lines:[['Umrah trip',1200,'On track · Mar 2027']],why:'Drawn from the Umrah goal’s own funding settings.',est:0,left:'on track'},
 {k:'grow',n:'Grow & give',i:'sprout',c:'var(--c0)',amt:790,spent:0,lines:[['Zakat set-aside',500,'Monthly'],['Buffer',290,'Unassigned room']],why:'Zakat first, the rest stays as a buffer.',est:0,left:'due 25th'},
];

function ring(s,pct){const r=16,c=2*Math.PI*r;return `<svg class="r" viewBox="0 0 38 38"><circle cx="19" cy="19" r="${r}" fill="none" stroke="var(--elev)" stroke-width="3"/><circle cx="19" cy="19" r="${r}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}"/></svg>`}
function tile(s){return `<span class="tile" style="color:${s.c};background:color-mix(in srgb,${s.c} 16%,var(--card))">${ic(s.i)}</span>`}

/* ---------- 1. START ---------- */
let hasDraft=true, hasData=true;
const INTENTS=[
 ['save','Save more','Build a monthly saving habit around your real spending.','coin',1],
 ['goal','Plan a big goal','A home, a car, a wedding or a trip, with a date and a monthly amount that fits.','target',2],
 ['debt','Get out of debt','Pay off cards and loans in the smartest order.','bank',3],
];
function screenStart(){
 return `<div class="phone">${status}<div class="scr">
  <div class="row"><span style="flex:1"></span><span class="pill" style="height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 12px">${ic('hist').replace('class="ico "','class="ico" style="width:12px;height:12px"')}About 3 min</span></div>

  <div class="row" style="align-items:flex-end;gap:12px">${buddgy(52)}<div style="min-width:0;padding-bottom:2px"><div class="micro">Budget builder</div><h2 class="h2">Build your budget</h2></div></div>
  <p class="sub" style="font-size:13.5px">Choose a starting point. Buddgy asks a few questions, then turns your answers into a monthly plan.</p>

  ${hasDraft?`<button class="sel" data-act="draft" style="min-height:64px">
    <span class="tile" style="color:var(--ink2);background:color-mix(in srgb,var(--c0) 16%,var(--card))">${ic('hammer')}</span>
    <span style="flex:1;min-width:0"><b style="display:block;font-size:15px">Continue "Balanced plan"</b><span class="sub" style="font-size:12px">Draft · 60% done · saved today</span></span>${ic('next')}</button>`:''}

  ${hasData?`<span class="pill t" style="align-self:flex-start;display:inline-flex;align-items:center;gap:5px;height:28px">${ic('check').replace('class="ico "','class="ico" style="width:13px;height:13px"')}Using your 4 months of data</span>`:''}

  <div style="display:flex;flex-direction:column;gap:10px">
  ${INTENTS.map(([k,n,s,i,c])=>`<button class="sel" data-act="intent" data-intent="${k}" style="min-height:84px;border-radius:16px;gap:14px">
    <span class="tile" style="width:48px;height:48px;border-radius:14px;color:var(--c${c});background:color-mix(in srgb,var(--c${c}) 16%,var(--card))">${ic(i)}</span>
    <span style="flex:1;min-width:0"><b style="display:block;font-size:17px">${n}</b><span class="sub" style="font-size:13px;display:block;margin-top:2px">${s}</span></span>${ic('next')}</button>`).join('')}
  </div>

  <div class="sep">or build it yourself</div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
    ${[['plus','Blank'],['layout','Template'],['copy','Copy a plan']].map(([i,l])=>`<button class="btn o s" style="padding:0 6px;font-size:13px">${ic(i)}${l}</button>`).join('')}
  </div>

 </div></div>`}

/* ---------- 1b. ABOUT YOU ---------- */
let aboutText='', aboutDone=false;
const GUIDE=[['Pay and payday','I take home 18,000 on the 25th. '],['Rent or mortgage','I rent for 6,000. '],['Family','I have two kids. '],['Debts','I owe 40,000 on a car loan, paying 1,800 a month. '],['Savings','I have 15,000 saved. '],['A goal','I want to save for a home in three years. ']];
function screenAbout(){
 const ok=aboutText.trim().length>=12;
 const found=[['Income','18,000 a month'],['Payday','25th'],['Housing','Rent, 6,000'],['Household','Family, 2 children'],['Debt','Car loan, 40,000 owed'],['Monthly payment','1,800'],['Savings','15,000'],['Goal','A home in 3 years']];
 return `<div class="phone">${status}<div class="scr">
  <div class="row"><button class="chip" style="width:44px;height:44px;padding:0;justify-content:center" data-act="aback" aria-label="Back">${ic('back')}</button><span style="flex:1"></span><span class="pill">Save more</span></div>
  ${aboutDone?`
  <div class="row" style="align-items:flex-end;gap:12px">${buddgy(48)}<div style="padding-bottom:2px"><div class="micro">Buddgy picked up</div><h2 class="h2">${found.length} things, so ${found.length+3} questions are skipped</h2></div></div>
  <div class="card" style="padding:4px 14px">${found.map(([l,v])=>`<div class="line"><div class="t"><b style="font-size:13.5px">${l}</b></div><span class="num" style="font-size:13.5px;color:var(--ink2)">${v}</span><span style="color:var(--green)">${ic('check').replace('class="ico "','class="ico" style="width:16px;height:16px"')}</span></div>`).join('')}</div>
  <p class="sub">I will ask only what is left: how you are paid, health cover, and a few more. You can change any answer later.</p>
  <button class="btn" data-act="aq" style="margin-top:auto">Continue</button>`
  :`
  <div class="row" style="align-items:flex-end;gap:12px">${buddgy(48)}<div style="padding-bottom:2px"><div class="micro">Buddgy listens</div><h2 class="h2">Tell me about yourself</h2></div></div>
  <p class="sub" style="font-size:13.5px">Add your take-home pay and payday, rent or mortgage, family, debts and what you owe, savings, and anything you want to reach. The more you write, the fewer questions you answer.</p>
  <textarea id="about" style="min-height:150px;font-size:15px" aria-label="About you" placeholder="e.g. I earn 18,000 a month on the 25th, rent a flat for 6,000, have two kids, owe 40,000 on a car loan and want to save for a home">${aboutText}</textarea>
  <div class="micro">Tap to add</div>
  <div class="chips">${GUIDE.map(([l,x],i)=>`<button class="chip" data-guide="${i}" style="height:40px">${ic('plus').replace('class="ico "','class="ico" style="width:14px;height:14px"')}${l}</button>`).join('')}</div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
   <button class="btn" data-act="aread" ${ok?'':'disabled'}>Continue</button>
   <p class="sub" style="text-align:center;font-size:12px">${ok?'Ready when you are.':'Write at least a short sentence to continue.'}</p>
  </div>`}
 </div></div>`}

/* ---------- 2. QUESTIONS ---------- */
const QS=[
 {id:'housing',lab:'Where do you live?',why:'Housing is usually the biggest line, so it sets everything else.',opts:['I rent','I own','With family','Company housing'],prog:30,left:5,stage:'Home'},
 {id:'rent',lab:'What is your monthly rent?',why:'We sized it against your income to check it is affordable.',amt:true,prog:44,left:4,stage:'Home',follow:'Asked because you rent'},
 {id:'debt',lab:'Do you owe money anywhere?',why:'Costly debt comes before saving in your plan.',opts:['No debts','Card or loan','Installments (BNPL)','Several'],prog:62,left:3,stage:'Debts',branch:true},
];
let qi=0,qAns={};
function screenQ(){
 const q=QS[qi];const ready=q.prog>=60;
 const bars=['Found','Home','Life','Debts','Secure','Aims'];
 const live=[['Bills',6500,'var(--c1)'],['Everyday',5200,'var(--c5)'],['Debts',q.prog>50?2100:0,'var(--c3)'],['Safety',q.prog>50?1850:0,'var(--c2)']];
 return `<div class="phone">${status}<div class="scr">
  <div class="row">
   ${qi>0?`<button class="chip" style="width:44px;height:44px;padding:0;justify-content:center" data-act="qback" aria-label="Back">${ic('back')}</button>`:''}
   <button class="chip" style="width:44px;height:44px;padding:0;justify-content:center" aria-label="Close">${ic('x')}</button>
   <div style="flex:1;min-width:0"><div class="micro">${q.stage} · ${q.left} left</div>
     <div class="row" style="gap:3px;margin-top:5px">${bars.map((b,i)=>`<i style="flex:1;height:4px;border-radius:9px;background:${i<=qi+1?'var(--pri)':'var(--elev)'}"></i>`).join('')}</div></div>
   <button class="chip" data-act="know" aria-label="What I know" style="height:44px">${ic('list')}</button>
  </div>

  <div class="card" style="padding:12px 14px">
   <div class="row" style="justify-content:space-between"><span class="micro">Your plan so far</span>
     <span class="pill ${ready?'g':'a'} num">${q.prog}% accurate</span></div>
   <div class="flow" style="margin:9px 0 6px;background:var(--elev)">${live.map(([n,v,c])=>`<i style="width:${v/180}%;background:${c};transition:width .4s"></i>`).join('')}</div>
   <div class="sub num" style="font-size:12px">${ready?'Good enough to build. More answers only sharpen it.':'Taking shape from your answers and your history.'}</div>
  </div>

  <div class="row" style="align-items:flex-end;gap:10px;margin-top:4px">${buddgy(40,'think')}<div class="micro" style="padding-bottom:3px">Buddgy asks</div></div>
  <h2 class="h2">${q.lab}</h2>
  ${q.follow?`<span class="pill t" style="align-self:flex-start">${q.follow}</span>`:''}
  <p class="sub"><b style="color:var(--ink)">Why: </b>${q.why}</p>

  ${q.amt?`<div class="card" style="display:flex;align-items:center;gap:8px;min-height:60px"><span class="micro">EGP</span><input id="amt" value="5,500" inputmode="numeric" aria-label="Monthly rent" style="flex:1;border:0;background:none;font:inherit;font-size:24px;font-weight:700;color:var(--ink);min-width:0;outline:0"><span class="pill g">${ic('check')}Matches your bank SMS</span></div>`
   :`<div style="display:flex;flex-direction:column;gap:8px">${q.opts.map((o,i)=>`<button class="sel" data-pick="${i}" aria-pressed="${qAns[q.id]===i}"><span style="flex:1;font-weight:600;font-size:14.5px">${o}</span>${qAns[q.id]===i?ic('check'):''}</button>`).join('')}</div>`}

  <button class="chip" style="align-self:flex-start;height:44px" data-act="notsure">Not sure → use a typical amount for ${'Cairo'}</button>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
   <button class="btn" data-act="qnext">Continue</button>
   ${ready?`<button class="btn g" data-act="build">Good enough. Build now (${q.prog}%)</button>`:''}
  </div>
 </div></div>`}

/* ---------- 3. REVIEW ---------- */
let rv=0, reviewed=new Set();
function screenReview(){
 const s=SEG[rv];const assigned=SEG.reduce((a,x)=>a+x.amt,0);
 return `<div class="phone">${status}<div class="scr">
  <div class="row"><button class="chip" style="width:44px;height:44px;padding:0;justify-content:center" aria-label="Back">${ic('back')}</button><b style="flex:1;font-size:17px">Review your plan</b><span class="pill num">${reviewed.size} of 7 checked</span></div>

  <div class="card" style="display:flex;flex-direction:column;gap:11px">
   <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:start">
    <div><div class="micro">Income</div><b class="num" style="font-size:16px">${fmt(INCOME)}</b></div>
    <div><div class="micro">Saved</div><b class="num" style="font-size:16px">${fmt(1850+1200+290)}<span style="font-size:12px;color:var(--green)"> 18%</span></b></div>
    <div><div class="micro">Free</div><b class="num" style="font-size:16px">${fmt(INCOME-assigned)}<span style="font-size:12px;color:var(--green)"> ${ic('check').replace('class="ico "','class="ico" style="width:13px;height:13px;vertical-align:-2px"')}</span></b></div>
   </div>
   <div class="flow">${SEG.map(x=>`<i style="width:${x.amt/INCOME*100}%;background:${x.c}"></i>`).join('')}</div>
   <div class="row" style="align-items:flex-start;gap:10px;background:var(--pri-soft);border-radius:12px;padding:10px">
    ${buddgy(30)}<div style="min-width:0;font-size:13px;line-height:1.4"><b>Safe and balanced.</b> Debt gets paid first, then the safety net. <span style="color:var(--amber);font-weight:600">Watch: dining is estimated.</span></div>
   </div>
  </div>

  <div class="rail" role="tablist" aria-label="Plan segments">${SEG.map((x,i)=>`<button class="seg" role="tab" aria-selected="${i===rv}" data-seg="${i}" aria-label="${x.n}">
    <span class="ring">${tile(x).replace('width:40px','')}</span>
    ${reviewed.has(i)?'<span class="dot ok"></span>':x.est?'<span class="dot"></span>':''}
    <span class="cap num">${x.amt>=1000?(x.amt/1000).toFixed(1)+'k':x.amt}</span></button>`).join('')}</div>

  <div class="card">
   <div class="row" style="margin-bottom:6px">${tile(s)}<div style="flex:1;min-width:0"><b style="font-size:16px">${s.n}</b><div class="sub num">${fmt(s.amt)} · ${Math.round(s.amt/INCOME*100)}% of income</div></div>${s.est?`<span class="pill a">${s.est} estimated</span>`:`<span class="pill g">From your data</span>`}</div>
   <div class="row" style="align-items:flex-start;gap:8px;font-size:13px;color:var(--ink2);padding:6px 0 8px">${ic('spark').replace('class="ico "','class="ico" style="width:16px;height:16px;color:var(--pri)"')}<span>${s.why}</span></div>
   ${s.lines.map(l=>`<div class="line"><div class="t"><b>${l[0]}</b><span>${l[2]}</span></div><b class="num">${fmt(l[1])}</b></div>`).join('')}
  </div>

  <div style="margin-top:auto;display:flex;gap:8px">
   <button class="btn o" style="flex:1" data-act="rprev" ${rv===0?'disabled':''}>${ic('back')}Back</button>
   <button class="btn" style="flex:1.5" data-act="rnext">${rv===6?'Activate plan':'Looks right'}${rv<6?ic('next'):''}</button>
  </div>
 </div></div>`}

/* ---------- 4. BUDGET PAGE ---------- */
let mode='month', sel=3;
function screenPage(){
 const m=mode==='month';const s=SEG[sel];
 const spent=SEG.reduce((a,x)=>a+x.spent,0);
 const left=INCOME-spent-1850-790; // still to be spent
 return `<div class="phone">${status}<div class="scr">
  <div class="row"><div style="flex:1;min-width:0"><div class="micro">Active since Oct</div><b style="font-size:19px">Balanced plan</b></div>
   <button class="chip" style="width:44px;height:44px;padding:0;justify-content:center" aria-label="Plans and history">${ic('hist')}</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;background:var(--elev);border-radius:12px;padding:3px" role="tablist">
   ${['plan','month'].map(k=>`<button role="tab" aria-selected="${mode===k}" data-mode="${k}" style="height:38px;border-radius:9px;font-weight:700;font-size:13.5px;${mode===k?'background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.12)':'color:var(--ink2)'}">${k==='plan'?'Plan':'This month'}</button>`).join('')}</div>

  <div class="card" style="display:flex;flex-direction:column;gap:10px">
   ${m?`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="micro">Left to spend</div><b class="num" style="font-size:30px;letter-spacing:-.02em">${fmt(left)}</b></div><div style="text-align:end"><span class="pill g">On pace</span><div class="sub num" style="margin-top:4px;font-size:12px">${fmt(Math.round(left/16))}/day · 16 days left</div></div></div>
   <div class="flow" style="position:relative;background:var(--elev)">${SEG.map(x=>`<i style="width:${x.amt/INCOME*100}%;background:color-mix(in srgb,${x.c} 22%,var(--elev));position:relative;overflow:hidden"><u style="position:absolute;inset:0 auto 0 0;width:${x.amt?x.spent/x.amt*100:0}%;background:${x.c}"></u></i>`).join('')}</div>
   <div class="sub num" style="font-size:11.5px">Day 14 of 30 · spent ${fmt(spent)} of ${fmt(INCOME)}</div>`
   :`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="micro">Monthly income</div><b class="num" style="font-size:30px;letter-spacing:-.02em">${fmt(INCOME)}</b></div><span class="pill g">${ic('check')}Every pound has a job</span></div>
   <div class="flow">${SEG.map(x=>`<i style="width:${x.amt/INCOME*100}%;background:${x.c}"></i>`).join('')}</div>
   <div class="sub num" style="font-size:12px">Saving 18% · Debt-free Sep 2027 · Safety 0.8 of 3 months</div>`}
  </div>

  <div class="rail" role="tablist" aria-label="Segments">${SEG.map((x,i)=>`<button class="seg" role="tab" aria-selected="${i===sel}" data-pg="${i}" aria-label="${x.n}">
    <span class="ring">${m?ring(x,x.amt?Math.min(1,x.spent/x.amt):0):''}${tile(x).replace('width:40px;height:40px','width:30px;height:30px')}</span>
    <span class="cap num">${m?(x.amt?Math.round(x.spent/x.amt*100)+'%':'–'):Math.round(x.amt/INCOME*100)+'%'}</span></button>`).join('')}</div>

  <div class="card">
   <div class="row" style="margin-bottom:4px">${tile(s)}<div style="flex:1;min-width:0"><b style="font-size:16px">${s.n}</b>
    <div class="sub num">${m?`${fmt(s.spent)} of ${fmt(s.amt)} · ${s.left}`:`${fmt(s.amt)} planned · ${s.lines.length} lines`}</div></div></div>
   ${s.lines.slice(0,4).map(l=>{const part=m&&s.amt?Math.min(1,(s.spent/s.amt)):0;return `<div class="line"><div class="t"><b>${l[0]}</b><span>${l[2]}</span></div><b class="num">${fmt(l[1])}</b></div>`}).join('')}
   ${s.lines.length>4?`<button class="seeAll" style="min-height:44px">See all ${s.lines.length}</button>`:''}
  </div>

  <div class="card row" style="gap:10px;padding:10px 12px">${buddgy(30)}<div style="font-size:13px;min-width:0;flex:1"><b>Dining is 18% over pace.</b> <span style="color:var(--ink2)">Move 200 from Fun?</span></div><button class="chip" style="height:40px">Do it</button></div>
 </div></div>`}

/* ---------- shell ---------- */
const FLOW=[
 {id:'start',tab:'1  Start',draw:screenStart,notes:[
  ['keep','Kept','Your current chooser design: Buddgy header, "About 3 min" pill, tinted-tile intent cards with chevrons, and the Blank, Template and Copy row.'],
  ['rm','Removed','The close button, two of the five intents, and the "Describe your situation instead" button and "Skip questions, build from it" link from the earlier mockup.'],
  ['new','Changed','Header "Build your budget" with a body that says what happens next. Three intents: Save more, Plan a big goal, Get out of debt. Each starts the questions at a different place.'],
  ['new','Added','A draft shows as one "Continue" row, only when one exists. Known data is a quiet status line, because it shortens every flow rather than being a fourth path.'],
  ['keep','Next','Picking a starting point leads to the required About you step.']]},
 {id:'a',tab:'2  About you',draw:screenAbout,notes:[
  ['new','Added','A required step after the starting point. It replaces the optional "describe your situation" button and the "skip questions" link. Everyone writes a few lines about themselves, with guiding chips for pay, housing, family, debts, savings and a goal.'],
  ['new','Result','Buddgy reads it and shows what it picked up, with the number of questions skipped. Whatever it could not read is asked later, so a detailed paragraph can cut the run in half.'],
  ['keep','Safe','If Buddgy cannot be reached the flow goes straight to the questions, so being offline never blocks a budget. Nothing written is sent anywhere else.']]},
 {id:'q',tab:'3  Questions',draw:screenQ,notes:[
  ['rm','Removed','"Estimate for me" and "Build my plan now" as full-width text buttons. They looked like errors and gave no sense of what changes.'],
  ['new','Replaced','"Not sure" is a chip under the answer. It says exactly what happens: a typical amount for your city. It is also logged as an estimate on the review screen.'],
  ['new','Replaced','The build shortcut appears only once the plan is accurate enough (60%+), and states the accuracy it will build with.'],
  ['new','Added','A live plan strip grows as you answer, like the goal builder. Branch hints ("Asked because you rent") explain why a question showed up.']]},
 {id:'r',tab:'4  Review',draw:screenReview,notes:[
  ['rm','Removed','The tall "Why this plan" card with numbered reasons and risk list.'],
  ['new','Replaced','A three-number summary (Income, Saved, Free), the plan strip, and one Buddgy line with one watch-out. About a quarter of the old height.'],
  ['new','Added','Review one segment at a time, as the manual builder does. Each icon carries its amount and a status dot: amber when it contains estimates, green once checked.'],
  ['new','Added','Each segment opens with a single reason line, then its lines with the source (your data or estimated). "Looks right" moves on; the last step activates.']]},
 {id:'p',tab:'5  Budget page',draw:screenPage,notes:[
  ['rm','Removed','Three tall chapters you scroll through, plus a separate flow card and insight chip stacked above them.'],
  ['new','Unified','Same segment rail as the builder. Plan mode shows each segment’s share; This month mode wraps the same icons in a progress ring and shows percent used.'],
  ['new','Added','One summary card swaps meaning with the switch: Plan shows income, savings rate and debt-free date; This month shows left to spend, per-day and pace. Total height stays constant.'],
  ['new','Kept','One Buddgy nudge with a single action replaces the insights list. The full list stays one tap away from the plans and history button.']]},
];
let cur=0;
function render(){
 const f=FLOW[cur];
 document.getElementById('phone').innerHTML=f.draw();
 document.getElementById('notes').innerHTML='<h2>What changed</h2>'+f.notes.map(n=>`<div class="note"><span class="tag ${n[0]}">${n[1]}</span>${n[2]}</div>`).join('');
 document.querySelectorAll('#tabs .tab').forEach((b,i)=>b.setAttribute('aria-selected',i===cur));
}
document.getElementById('tabs').innerHTML=FLOW.map((f,i)=>`<button class="tab" role="tab" data-t="${i}">${f.tab}</button>`).join('');
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t],[data-aim],[data-act],[data-pick],[data-seg],[data-mode],[data-pg],[data-guide]');if(!t)return;
 const d=t.dataset;
 if(d.t!==undefined){cur=+d.t;}
 else if(d.aim){startPick=d.aim;}
 else if(d.act==='draft'||d.act==='intent'){cur=1;aboutDone=false;}
 else if(d.act==='aback'){cur=0;}
 else if(d.act==='aread'){aboutDone=true;}
 else if(d.act==='aq'){cur=2;qi=0;}
 else if(d.guide!==undefined){aboutText+=GUIDE[+d.guide][1];}
 else if(d.pick!==undefined){qAns[QS[qi].id]=+d.pick;}
 else if(d.act==='qnext'||d.act==='notsure'){if(qi<QS.length-1)qi++;else cur=3;}
 else if(d.act==='qback'){qi=Math.max(0,qi-1);}
 else if(d.act==='build'){cur=3;}
 else if(d.seg!==undefined){rv=+d.seg;}
 else if(d.act==='rnext'){reviewed.add(rv);if(rv<6)rv++;else cur=4;}
 else if(d.act==='rprev'){rv=Math.max(0,rv-1);}
 else if(d.mode){mode=d.mode;}
 else if(d.pg!==undefined){sel=+d.pg;}
 else return;
 render();
});
document.addEventListener('input',e=>{if(e.target.id==='about'){aboutText=e.target.value;const b=document.querySelector('[data-act=aread]');if(b){const ok=aboutText.trim().length>=12;b.disabled=!ok;b.nextElementSibling&&(b.nextElementSibling.textContent=ok?'Ready when you are.':'Write at least a short sentence to continue.')}}});
render();
</script>
