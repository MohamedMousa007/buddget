<meta charset="utf-8">
<title>Buddget Budget Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: a workbench. The phone is the product; the panels around it show what the engine and the graph are doing. */
:root{
  --bg:#F4F7F6;--card:#FFFFFF;--elev:#ECF1F0;--sunk:#E2E9E8;--line:#DDE6E4;--line2:#CBD6D3;
  --ink:#0D1A18;--ink2:#566B68;--ink3:#5F6968;
  --pri:#0D8578;--pri-h:#0B7568;--pri-ink:#0B7568;--pri-soft:#E3F6F3;--on-pri:#FFFFFF;--pri-bright:#12B0A0;
  --red:#BE343A;--red-soft:#FBE7E7;--green:#0F7635;--green-soft:#E3F5EA;--amber:#8C5E0A;--amber-soft:#FBF0DA;--gold:#896617;
  --c1:#11A596;--c2:#B68E30;--c3:#E5684D;--c4:#6E7BF2;--c5:#389BD9;--c6:#8B5CF6;--c0:#8A9794;
  --hero-a:#0E9384;--hero-b:#0A534A;
  --sh1:0 1px 2px rgba(13,26,24,.06);--sh2:0 1px 2px rgba(13,26,24,.05),0 10px 24px -14px rgba(13,26,24,.22);--sh3:0 2px 6px rgba(13,26,24,.06),0 24px 48px -20px rgba(13,26,24,.28);
  --sans:"DM Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A100F;--card:#111917;--elev:#18211F;--sunk:#212C2A;--line:#25302E;--line2:#33403D;--ink:#EAF2F0;--ink2:#9BABA8;--ink3:#879592;
  --pri:#1FC3B2;--pri-h:#35D4C3;--pri-ink:#7FE6DA;--pri-soft:#0F2723;--on-pri:#04201C;--pri-bright:#1FC3B2;
  --red:#F2646A;--red-soft:#3A1B1D;--green:#37C368;--green-soft:#123021;--amber:#EDB24A;--amber-soft:#33280F;--gold:#EDC463;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#879592;--hero-a:#0E9384;--hero-b:#073C36;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 1px 2px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);--sh3:0 2px 8px rgba(0,0,0,.5),0 28px 56px -22px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"],.ph.dark{
  --bg:#0A100F;--card:#111917;--elev:#18211F;--sunk:#212C2A;--line:#25302E;--line2:#33403D;--ink:#EAF2F0;--ink2:#9BABA8;--ink3:#879592;
  --pri:#1FC3B2;--pri-h:#35D4C3;--pri-ink:#7FE6DA;--pri-soft:#0F2723;--on-pri:#04201C;--pri-bright:#1FC3B2;
  --red:#F2646A;--red-soft:#3A1B1D;--green:#37C368;--green-soft:#123021;--amber:#EDB24A;--amber-soft:#33280F;--gold:#EDC463;
  --c1:#1FC3B2;--c2:#EDC463;--c3:#F27E66;--c4:#8A94F5;--c5:#57B2ED;--c6:#A17DF9;--c0:#879592;--hero-a:#0E9384;--hero-b:#073C36;
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 1px 2px rgba(0,0,0,.4),0 14px 32px -18px rgba(0,0,0,.7);--sh3:0 2px 8px rgba(0,0,0,.5),0 28px 56px -22px rgba(0,0,0,.8);color-scheme:dark}
.ph.light{
  --bg:#F4F7F6;--card:#FFFFFF;--elev:#ECF1F0;--sunk:#E2E9E8;--line:#DDE6E4;--line2:#CBD6D3;--ink:#0D1A18;--ink2:#566B68;--ink3:#5F6968;
  --pri:#0D8578;--pri-h:#0B7568;--pri-ink:#0B7568;--pri-soft:#E3F6F3;--on-pri:#FFFFFF;--pri-bright:#12B0A0;
  --red:#BE343A;--red-soft:#FBE7E7;--green:#0F7635;--green-soft:#E3F5EA;--amber:#8C5E0A;--amber-soft:#FBF0DA;--gold:#896617;
  --c1:#11A596;--c2:#B68E30;--c3:#E5684D;--c4:#6E7BF2;--c5:#389BD9;--c6:#8B5CF6;--c0:#8A9794;--hero-a:#0E9384;--hero-b:#0A534A;
  --sh1:0 1px 2px rgba(13,26,24,.06);--sh2:0 1px 2px rgba(13,26,24,.05),0 10px 24px -14px rgba(13,26,24,.22);--sh3:0 2px 6px rgba(13,26,24,.06),0 24px 48px -20px rgba(13,26,24,.28);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.mut{color:var(--ink2)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
svg.lucide{width:1em;height:1em;flex:none}

/* ---- page chrome */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--pri-soft);color:var(--pri-ink);font-size:19px}
.tabs{display:flex;gap:2px;background:var(--elev);padding:3px;border-radius:12px;flex-wrap:wrap}
.tabs button{height:34px;padding:0 13px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.sim-pill{margin-inline-start:auto;font-size:12px;color:var(--amber);background:var(--amber-soft);padding:5px 10px;border-radius:99px;font-weight:600}
main.wrap{padding-block:18px 60px}
section[hidden]{display:none}
h1{font-size:22px;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
h2{font-size:16px;margin:0 0 8px;letter-spacing:-.01em}
h3{font-size:13.5px;margin:0 0 6px}
p{margin:0 0 8px;max-width:70ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel+.panel{margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:13px}
.btn:hover{background:var(--elev)} .btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)} .btn.pri:hover{background:var(--pri-h)}
.btn.s{height:30px;padding:0 10px;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--elev);color:var(--ink2);white-space:nowrap}
.tag.you{background:var(--pri-soft);color:var(--pri-ink)} .tag.records{background:color-mix(in srgb,var(--c4) 16%,var(--card));color:var(--c4)}
.tag.estimate{background:var(--amber-soft);color:var(--amber)} .tag.rule{background:var(--elev);color:var(--ink2)} .tag.ai{background:color-mix(in srgb,var(--c6) 16%,var(--card));color:var(--c6)}
.tag.bad{background:var(--red-soft);color:var(--red)} .tag.ok{background:var(--green-soft);color:var(--green)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:start;font-weight:600;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
.scroll-x{overflow-x:auto}
code{font-family:var(--mono);font-size:11.5px;background:var(--elev);padding:1px 5px;border-radius:5px;word-break:break-word}

/* ---- experience workbench */
.bench{display:grid;grid-template-columns:270px 390px minmax(0,1fr);gap:18px;align-items:start}
.bench>*{min-width:0}
@media (max-width:1180px){.bench{grid-template-columns:390px minmax(0,1fr)}.bench .left{grid-column:1/-1;order:-1}.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}.stage{justify-self:center}}
.pcard{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;padding:9px 10px;border-radius:12px;border:1px solid transparent}
.pcard:hover{background:var(--elev)} .pcard[aria-pressed=true]{background:var(--pri-soft);border-color:var(--pri)}
.pcard b{display:block;font-size:13.5px} .pcard span{font-size:12px;color:var(--ink2);display:block}
.ava{width:32px;height:32px;border-radius:10px;background:var(--elev);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pcard[aria-pressed=true] .ava{background:var(--pri);color:var(--on-pri)}
.pcard .ava{display:grid}
@media (max-width:820px){.plist{grid-template-columns:1fr 1fr!important;gap:2px}.pcard span span{display:none}.pcard{padding:6px 8px}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.sw input{width:18px;height:18px;accent-color:var(--pri)}
.seg{display:inline-flex;background:var(--elev);border-radius:9px;padding:2px}
.seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.log{font-size:12px;max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log div{padding:4px 8px;border-radius:8px;background:var(--elev)}
.log time{color:var(--ink3);font-family:var(--mono);font-size:10.5px;margin-inline-end:6px}
.kv{display:grid;margin:0;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.reg{max-height:330px;overflow:auto}.reg code,.insp td code{word-break:normal}.reg td:first-child{white-space:nowrap}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}

/* ---- the phone */
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:820px){.stage{position:static}}
.ph{width:min(390px,100%);height:min(800px,calc(100vh - 110px));min-height:560px;background:var(--bg);color:var(--ink);border-radius:38px;border:1px solid var(--line2);box-shadow:var(--sh3);overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:15px}
.ph[dir=rtl]{font-family:"IBM Plex Sans Arabic","DM Sans",system-ui,sans-serif}
.ph .sb{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font:600 12.5px var(--mono);direction:ltr}
.ph .sb span{display:flex;gap:5px;align-items:center}
.ph .banner{flex:none;font-size:12px;font-weight:600;text-align:center;padding:5px 12px;background:var(--amber-soft);color:var(--amber)}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .22s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr,.sheet,.bud *{animation:none!important}}
.hd{flex:none;display:flex;align-items:center;gap:6px;min-height:52px;padding:0 6px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:var(--ink2);flex:none}
.ib:hover{background:var(--elev)}
.ph[dir=rtl] .flip{transform:scaleX(-1)}
.pills{flex:1;display:flex;gap:5px;padding:0 4px}
.pills i{flex:1;height:4px;border-radius:99px;background:var(--sunk)} .pills i.on{background:var(--pri)}
.ghost{height:44px;padding:0 12px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink2)}
.ghost:hover{background:var(--elev)}
.body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.ft{flex:none;padding:10px 16px 18px;display:flex;flex-direction:column;gap:6px;border-top:1px solid transparent}
.cta{height:48px;border-radius:12px;background:var(--pri);color:var(--on-pri);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta:hover{background:var(--pri-h)} .cta:disabled{opacity:.4;cursor:not-allowed}
.cta.alt{background:var(--card);color:var(--ink);border:1px solid var(--line2)} .cta.alt:hover{background:var(--elev)}
.cta.txt{background:none;color:var(--ink2);height:44px} .cta.txt:hover{background:var(--elev)}
.bud{width:60px;height:60px;border-radius:20px;background:var(--pri-soft);display:grid;place-items:center;color:var(--ink);flex:none}
.bud svg{width:38px;height:38px;animation:bob 3.2s ease-in-out infinite}
.bud.s{width:44px;height:44px;border-radius:15px}.bud.s svg{width:28px;height:28px}
@keyframes bob{50%{transform:translateY(-2px)}}
.ttl{font-size:25px;line-height:1.16;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance}
.ph[dir=rtl] .ttl{letter-spacing:0;line-height:1.35}
.ttl.m{font-size:21px}
.lead{font-size:15px;line-height:1.45;color:var(--ink2);margin:-8px 0 0}
.why{font-size:13.5px;color:var(--ink2);margin:-10px 0 0}
.opt{display:flex;align-items:center;gap:10px;min-height:50px;padding:10px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px;text-align:start;width:100%}
.opt:hover{border-color:var(--line2)} .opt[aria-pressed=true]{border-color:var(--pri);background:var(--pri-soft)}
.opt .ck{margin-inline-start:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:13px;color:transparent;flex:none}
.opt[aria-pressed=true] .ck{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.opt small{display:block;font-weight:400;font-size:12.5px;color:var(--ink2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px} .g1{display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--elev);color:var(--ink2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-ink)}
.chip.s{height:34px;padding:0 11px;font-size:12.5px}
.amt{display:flex;align-items:center;gap:8px;height:54px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--elev)}
.amt:focus-within{border-color:var(--pri)}
.amt input{flex:1;min-width:0;border:0;background:none;outline:0;font:700 24px var(--mono);direction:ltr;text-align:start}
.ph[dir=rtl] .amt input{text-align:end}
.amt span{font:600 15px var(--mono);color:var(--ink3)}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>label,.fld>.lb{font-weight:600;font-size:15px}
.fld .hint{font-size:12.5px;color:var(--ink2);margin-top:-4px}
.txt-in{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--elev);padding:0 14px;font-size:16px;width:100%}
textarea.txt-in{height:auto;min-height:132px;padding:12px 14px;resize:none;line-height:1.45;font-size:15px}
.stp{display:flex;align-items:center;justify-content:center;gap:22px}
.stp button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line2);font-size:22px;display:grid;place-items:center}
.stp b{font:600 34px var(--mono);min-width:64px;text-align:center}
input[type=range]{width:100%;height:36px;accent-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.card.p{padding:14px}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;width:100%;text-align:start;min-height:52px}
.li+.li{border-top:1px solid var(--line)}
button.li:hover{background:var(--elev)}
.li .nm{flex:1;min-width:0}
.li .nm b{display:block;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.li .am{font:600 14.5px var(--mono);direction:ltr;white-space:nowrap}
.tile{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none;background:color-mix(in srgb,var(--tc,var(--c0)) 16%,var(--card));color:var(--tc,var(--c0))}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--elev);color:var(--ink2);display:flex;gap:9px;align-items:flex-start}
.note svg{margin-top:2px;font-size:15px}
.note.warn{background:var(--amber-soft);color:var(--amber)} .note.bad{background:var(--red-soft);color:var(--red)} .note.ok{background:var(--green-soft);color:var(--green)} .note.ai{background:color-mix(in srgb,var(--c6) 12%,var(--card));color:var(--ink)}
.hero{border-radius:20px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero .big{font:700 30px var(--mono);letter-spacing:-.02em;direction:ltr;display:inline-block}
.hero .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.2);margin:12px 0 8px}
.bar i{display:block;height:100%}
.hero .legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;opacity:.95}
.hero .legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--d);margin-inline-end:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;min-width:0}
.stat b{display:block;font:700 15px var(--mono);letter-spacing:-.02em}
.ph[dir=rtl] .stat b{font-family:inherit;letter-spacing:0}
.stat span{font-size:11.5px;color:var(--ink2);line-height:1.25;display:block}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:-8px}
.sec-h b{font-size:15px;flex:1}.sec-h .am{font:600 13.5px var(--mono);color:var(--ink2);direction:ltr}
.sheet-bg{position:absolute;inset:0;background:rgba(4,20,18,.45);z-index:5;display:flex;align-items:flex-end}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-height:88%;display:flex;flex-direction:column;animation:up .24s ease-out;border-top:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet .grab{width:36px;height:4px;border-radius:99px;background:var(--line2);margin:8px auto 2px;flex:none}
.sheet .sh-h{display:flex;align-items:center;padding:6px 8px 4px 18px;gap:8px;flex:none}
.sheet .sh-h b{flex:1;font-size:18px;font-weight:700}
.sheet .sh-b{overflow-y:auto;padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.cmp{width:100%;font-size:13px}
.cmp td,.cmp th{padding:7px 4px}
.cmp td.r{font-family:var(--mono);direction:ltr;white-space:nowrap}
.up{color:var(--green)} .dn{color:var(--red)}
.steps{display:flex;flex-direction:column;gap:10px}
.steps div{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink3);transition:color .2s}
.steps div.on{color:var(--ink)} .steps i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:13px;color:transparent;flex:none}
.steps div.on i{background:var(--green);border-color:var(--green);color:#fff}
